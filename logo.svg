<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" width="400" height="160">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <!-- Cyan glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <!-- Purple accent -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <!-- Truck body gradient -->
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#0369A1"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip for rounded rect -->
    <clipPath id="bgClip">
      <rect width="400" height="160" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g clip-path="url(#bgClip)" opacity="0.06">
    <line x1="0" y1="20" x2="400" y2="20" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="400" y2="40" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="400" y2="80" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="400" y2="120" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="400" y2="140" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="40" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="160" stroke="#22D3EE" stroke-width="0.5"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="160" rx="2" fill="url(#cyanGrad)"/>

  <!-- ── TRUCK ICON (left side) ── -->
  <g transform="translate(28, 38)" filter="url(#softGlow)">

    <!-- Truck body / cargo -->
    <rect x="0" y="8" width="52" height="38" rx="4" fill="url(#truckGrad)"/>

    <!-- Cargo door line -->
    <line x1="26" y1="8" x2="26" y2="46" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>

    <!-- Cab -->
    <rect x="52" y="18" width="28" height="28" rx="3" fill="#0284C7"/>

    <!-- Windshield -->
    <rect x="55" y="20" width="20" height="14" rx="2" fill="#BAE6FD" opacity="0.9"/>

    <!-- Cab roof curve -->
    <path d="M52,18 Q62,10 80,18" fill="#0369A1"/>

    <!-- Exhaust pipe -->
    <rect x="77" y="10" width="4" height="10" rx="2" fill="#475569"/>
    <!-- Exhaust puff -->
    <circle cx="79" cy="8" r="3" fill="#94A3B8" opacity="0.4"/>
    <circle cx="82" cy="5" r="2" fill="#94A3B8" opacity="0.25"/>

    <!-- Front bumper -->
    <rect x="78" y="38" width="4" height="8" rx="1" fill="#0369A1"/>

    <!-- Headlight -->
    <rect x="78" y="24" width="4" height="6" rx="1" fill="#FDE68A"/>
    <!-- Headlight glow -->
    <ellipse cx="82" cy="27" rx="5" ry="3" fill="#FDE68A" opacity="0.3"/>

    <!-- Road / ground line -->
    <line x1="0" y1="48" x2="84" y2="48" stroke="#1E40AF" stroke-width="1" opacity="0.4"/>

    <!-- Rear wheel -->
    <circle cx="18" cy="50" r="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="18" cy="50" r="5" fill="#334155"/>
    <circle cx="18" cy="50" r="2" fill="#0EA5E9"/>

    <!-- Front wheel -->
    <circle cx="67" cy="50" r="9" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="67" cy="50" r="4.5" fill="#334155"/>
    <circle cx="67" cy="50" r="2" fill="#0EA5E9"/>

    <!-- Route dots (path being travelled) -->
    <circle cx="4" cy="62" r="2" fill="#0EA5E9" opacity="0.8"/>
    <circle cx="12" cy="62" r="2" fill="#0EA5E9" opacity="0.6"/>
    <circle cx="20" cy="62" r="2" fill="#0EA5E9" opacity="0.4"/>
    <circle cx="28" cy="62" r="1.5" fill="#0EA5E9" opacity="0.3"/>

  </g>

  <!-- ── ROUTE PATH decoration ── -->
  <path d="M 130 120 Q 145 108 155 115 Q 165 122 178 110" 
        stroke="url(#cyanGrad)" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="4 3"/>

  <!-- ── TEXT ── -->
  <!-- CYBER -->
  <text x="148" y="82"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="42"
        font-weight="900"
        letter-spacing="-1"
        fill="url(#cyanGrad)"
        filter="url(#glow)">CYBER</text>

  <!-- COMMANDES -->
  <text x="148" y="116"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="28"
        font-weight="900"
        letter-spacing="3"
        fill="white"
        opacity="0.92">COMMANDES</text>

  <!-- Tagline -->
  <text x="149" y="133"
        font-family="'Arial', sans-serif"
        font-size="9"
        letter-spacing="2.5"
        fill="#64748B">PLANIFICATION D'ITINÉRAIRES</text>

  <!-- Right accent — small geometric decorations -->
  <rect x="368" y="30" width="3" height="3" rx="0.5" fill="#0EA5E9" opacity="0.6"/>
  <rect x="376" y="30" width="3" height="3" rx="0.5" fill="#A855F7" opacity="0.6"/>
  <rect x="368" y="38" width="3" height="3" rx="0.5" fill="#A855F7" opacity="0.4"/>
  <rect x="376" y="38" width="3" height="3" rx="0.5" fill="#0EA5E9" opacity="0.4"/>

  <!-- Bottom right — version tag -->
  <text x="362" y="148"
        font-family="monospace"
        font-size="8"
        fill="#334155"
        text-anchor="middle">L3 MIAGE</text>

  <!-- Cyan accent line under CYBER -->
  <rect x="148" y="88" width="200" height="2" rx="1" fill="url(#cyanGrad)" opacity="0.4"/>

</svg>